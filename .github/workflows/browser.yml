name: browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escape-routes:
    name: sandbox escape routes (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      # the only dependency in the project, kept in tests/browser so the site and `npm test` stay free of dependencies
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      # what each engine did (the canary's hits, every report), so a failure can be read without running it again
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            tests/browser/.results
            tests/browser/test-results
          retention-days: 7
